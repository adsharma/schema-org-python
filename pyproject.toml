[project]
name = "schema-org-python"
version = "0.1.1"
description = "Schema.org schemas as pydantic models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arun Sharma", email = "arun@sharma-home.net" }]
keywords = ["schema.org", "pydantic", "structured-data", "json-ld", "rdf", "models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "fquery>=0.5",
    "requests>=2.32.5",
    "rdflib>=7.5.0",
    "autoflake>=2.3.1",
]

[project.urls]
Homepage = "https://github.com/adsharma/schema-org-python"
Repository = "https://github.com/adsharma/schema-org-python"
"Bug Tracker" = "https://github.com/adsharma/schema-org-python/issues"

[dependency-groups]
dev = [
    "pytest>=7.1.2",
    "pytest-cov>=4.0.0",
    "black>=24.10.0",
    "isort>=5.13.2",
    "flake8>=7.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schema_models"]

[tool.isort]
profile = "black"

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = ["*/.venv/*", "*/tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
